[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
; Suppresses the ESP32 core's own internal [E]/[W] log lines (e.g. the noisy
; "Wire.cpp:499 requestFrom() Error -1" spam when the I2C pulse sensor has a
; flaky connection). Our own Serial.print/println() debug lines are plain
; writes, not gated by this, so they're unaffected.
build_flags = -DCORE_DEBUG_LEVEL=0
